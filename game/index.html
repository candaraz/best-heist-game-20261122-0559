<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Gallery — a one-night heist</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0a12; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; width: min(100vw, 160vh); height: auto; max-height: 100vh;
          aspect-ratio: 8 / 5; background: #14101d; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
            clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="800"
    aria-label="The Midnight Gallery: sneak through the gallery, pocket the Star Sapphire, and reach the skylight exit before the alarm fills"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
